<!doctype html>
<meta charset="utf-8">
<title>Fragmento — inspetor de rasterização</title>
<!--
  Rasteriza um efeito no tamanho REAL do projeto e mostra o resultado 1:1.

  Existe porque o `/criar` desenha em 1280×720 e o palco do editor desenha
  reduzido: nenhum dos dois mostra o pixel que o export vai gravar. Quando um
  artefato aparece só no arquivo final, é aqui que se descobre se ele veio do
  render ou do codificador.

  `npm run dev` e abra /dev/rasterizar.html.
-->
<style>
  body { margin:0; background:#0b0c10; color:#e8e8ea; font:12px ui-monospace,monospace; padding:14px; }
  h1 { font-size:13px; color:#ffd479; margin:0 0 8px; }
  .barra { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  select, button, input { font:inherit; padding:3px 6px; background:#f7efdc; color:#241a33; border:2px solid #241a33; }
  canvas { border:1px solid #333; display:block; margin-top:8px; }
  .nota { color:#8a8d98; line-height:1.6; }
  .linha { white-space:pre; }
</style>

<h1>Inspetor de rasterização — 1:1, no tamanho do projeto</h1>
<div class="barra">
  <label>efeito <select id="qual"></select></label>
  <label>tamanho <select id="tam">
    <option value="1920x1080">1920×1080</option>
    <option value="1280x720">1280×720</option>
    <option value="1080x1920">1080×1920</option>
  </select></label>
  <label>t <input id="t" type="number" value="0.5" step="0.05" style="width:70px"></label>
  <label>fundo <select id="fundo">
    <option value="amostra">amostra</option>
    <option value="preto">preto</option>
    <option value="nada">nada (alpha)</option>
  </select></label>
  <button id="ir">RASTERIZAR</button>
  <button id="sequencia">SIMULAR EXPORT (30 quadros)</button>
  <button id="corrida">SIMULAR EXPORT + PREVIEW JUNTOS</button>
  <button id="baixar">BAIXAR PNG</button>
</div>
<div id="saida" class="nota"></div>
<canvas id="tela"></canvas>

<script type="module">
import { Overlay } from '/src/criar/overlay.ts';
import { SEMENTES } from '/src/criar/sementes.ts';
import { composicaoDe, padroes, variaveisCss, normalizar } from '/src/criar/api.ts';

const qual = document.getElementById('qual');
for (const k of Object.keys(SEMENTES)) qual.add(new Option(k, k));
qual.value = 'filtro';

const tela = document.getElementById('tela');
const saida = document.getElementById('saida');
const p = s => saida.insertAdjacentHTML('beforeend', `<div class="linha">${s}</div>`);

function amostra(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#123b63'); g.addColorStop(0.55, '#6f7f95'); g.addColorStop(1, '#0d1622');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = `hsl(${i * 26},70%,${28 + (i % 5) * 12}%)`;
    ctx.fillRect((i * 137) % w, (i * 83) % h, w * 0.07, h * 0.12);
  }
}

document.getElementById('ir').onclick = async () => {
  saida.innerHTML = '';
  const semente = SEMENTES[qual.value];
  const manifesto = JSON.parse(semente.manifesto);
  const [w, h] = document.getElementById('tam').value.split('x').map(Number);
  const t = parseFloat(document.getElementById('t').value);

  tela.width = w; tela.height = h;
  tela.style.width = Math.min(w, 1400) + 'px';
  const ctx = tela.getContext('2d', { willReadFrequently: true });

  const fundo = document.getElementById('fundo').value;
  ctx.clearRect(0, 0, w, h);
  if (fundo === 'amostra') amostra(ctx, w, h);
  if (fundo === 'preto') { ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, w, h); }

  const ov = new Overlay({ meta: manifesto.meta, html: semente.html, css: semente.css });
  const inicio = performance.now();
  const img = await ov.quadro({
    largura: w, altura: h, t, duracao: 3,
    params: variaveisCss(manifesto.params ?? {}, normalizar(manifesto.params ?? {}, padroes(manifesto.params ?? {}))),
  });
  const ms = performance.now() - inicio;

  ctx.globalCompositeOperation = composicaoDe(manifesto.meta?.mistura);
  ctx.drawImage(img, 0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  ov.destruir();

  p(`${w}×${h} · t=${t}s · mistura=${manifesto.meta?.mistura ?? 'normal'} · ${Math.round(ms)}ms`);
  p(`intrínseco do bitmap: ${img.naturalWidth}×${img.naturalHeight}` +
    (img.naturalWidth !== w ? '  ← DIFERENTE do pedido: foi ESCALADO' : '  (1:1, sem escala)'));

  // energia de alta frequência: grão de verdade sobe isto; chapa lisa não
  const d = ctx.getImageData(Math.round(w * 0.62), Math.round(h * 0.62), 200, 140).data;
  let soma = 0, n = 0;
  for (let i = 4; i < d.length; i += 4) { soma += Math.abs(d[i] - d[i - 4]); n++; }
  p(`granulação numa área lisa: ${(soma / n).toFixed(2)}`);
};

/**
 * Roda a MESMA sequência que o export roda: `overlayFrames.preparar` seguido de
 * consulta, quadro a quadro, na grade de 30fps. É o que separa "o runtime não
 * anima" de "o armazém está servindo quadro velho".
 */
document.getElementById('sequencia').onclick = async () => {
  saida.innerHTML = '';
  const { overlayFrames } = await import('/src/engine/overlayFrames.ts');
  const { makeOverlayLayer } = await import('/src/engine/project.ts');
  const semente = SEMENTES[qual.value];
  const manifesto = JSON.parse(semente.manifesto);
  const [w, h] = document.getElementById('tam').value.split('x').map(Number);

  const layer = makeOverlayLayer({
    name: 'teste', start: 0, duration: 8,
    html: semente.html, css: semente.css,
    schema: manifesto.params ?? {}, values: {},
    ...(manifesto.meta?.mistura ? { blend: manifesto.meta.mistura } : {}),
  });
  const projeto = { width: w, height: h, fps: 30, background: '#000', layers: [layer], media: [] };

  tela.width = w; tela.height = h; tela.style.width = Math.min(w, 1400) + 'px';
  const ctx = tela.getContext('2d', { willReadFrequently: true });

  const hashes = [];
  for (let i = 0; i < 30; i++) {
    const t = i / 30;
    await overlayFrames.preparar(projeto, t, w, h);
    const img = overlayFrames.quadroDe(layer, t);
    ctx.clearRect(0, 0, w, h);
    if (img) ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(Math.round(w * 0.1), Math.round(h * 0.6), 200, 140).data;
    let hh = 2166136261;
    for (let k = 0; k < d.length; k += 4) { hh ^= d[k] + d[k + 1] * 3 + d[k + 2] * 7 + d[k + 3] * 11; hh = Math.imul(hh, 16777619); }
    hashes.push({ i, t: +t.toFixed(3), tem: !!img, h: (hh >>> 0).toString(16) });
  }
  overlayFrames.destruir();

  const distintos = new Set(hashes.map(x => x.h)).size;
  const semQuadro = hashes.filter(x => !x.tem).length;
  p(`30 quadros na grade de 30fps · ${distintos} imagens distintas · ${semQuadro} sem quadro`);
  p(hashes.map(x => `${x.i}:${x.tem ? x.h.slice(0, 6) : 'VAZIO'}`).join('  '));
};

/**
 * O export tem que desenhar o quadro que ELE preparou, mesmo com o preview
 * mexendo no armazém no meio.
 *
 * Determinístico de propósito: em vez de tentar acertar a janela de tempo de
 * uma corrida, o teste ATROPELA o armazém entre preparar e desenhar, que é o
 * pior caso que a corrida pode produzir. Se o mapa devolvido ainda entrega o
 * quadro certo, a corrida não tem como estragar o arquivo.
 */
document.getElementById('corrida').onclick = async () => {
  saida.innerHTML = '';
  const { overlayFrames } = await import('/src/engine/overlayFrames.ts');
  const { makeOverlayLayer } = await import('/src/engine/project.ts');
  const semente = SEMENTES[qual.value];
  const manifesto = JSON.parse(semente.manifesto);
  const [w, h] = document.getElementById('tam').value.split('x').map(Number);

  const layer = makeOverlayLayer({
    name: 'teste', start: 0, duration: 8,
    html: semente.html, css: semente.css,
    schema: manifesto.params ?? {}, values: {},
  });
  const projeto = { width: w, height: h, fps: 30, background: '#000', layers: [layer], media: [] };

  tela.width = w; tela.height = h; tela.style.width = Math.min(w, 1400) + 'px';
  const ctx = tela.getContext('2d', { willReadFrequently: true });
  const impressao = () => {
    const d = ctx.getImageData(Math.round(w * 0.1), Math.round(h * 0.6), 200, 140).data;
    let hh = 2166136261;
    for (let k = 0; k < d.length; k += 4) { hh ^= d[k] + d[k+1]*3 + d[k+2]*7 + d[k+3]*11; hh = Math.imul(hh, 16777619); }
    return (hh >>> 0).toString(16);
  };
  const desenhar = img => { ctx.clearRect(0,0,w,h); if (img) ctx.drawImage(img,0,0,w,h); return impressao(); };

  let ok = 0, erro = 0, perdidosPelaConsulta = 0;
  for (let i = 0; i < 10; i++) {
    const t = 0.02 + i * 0.06;

    // 1. o export prepara e guarda o que recebeu
    const mapa = await overlayFrames.quadrosEm(projeto, t, w, h);
    const meu = mapa.get(layer.id);
    const hashEsperado = desenhar(meu);

    // 2. o preview atropela o armazém com OUTROS instantes
    for (const outro of [3.1, 3.2, 3.3, 3.4, 3.5]) {
      await overlayFrames.quadrosEm(projeto, outro, w, h);
    }

    // 3. o quadro que o export tem em mãos continua sendo o certo?
    const depois = desenhar(mapa.get(layer.id));
    if (!meu) { erro++; p(`t=${t.toFixed(2)}: SEM QUADRO`); continue; }
    if (depois !== hashEsperado) { erro++; p(`t=${t.toFixed(2)}: o quadro MUDOU depois do atropelo`); continue; }
    ok++;

    // 4. CONTROLE: o caminho antigo, consultando o armazém depois do atropelo.
    //    Se ele também sobrevivesse, este teste não teria dentes.
    const pelaConsulta = overlayFrames.quadroDe(layer, t);
    if (!pelaConsulta || desenhar(pelaConsulta) !== hashEsperado) perdidosPelaConsulta++;
  }
  overlayFrames.destruir();
  p(`${ok}/10 quadros sobreviveram ao armazém sendo atropelado${erro ? ` · ${erro} falha(s)` : ''}`);
  p(`controle — consultando o armazém depois do atropelo: ${perdidosPelaConsulta}/10 perdidos`);
  p(perdidosPelaConsulta > 0
    ? 'o teste tem dentes: o caminho antigo perde quadro, o novo não.'
    : 'ATENÇÃO: o caminho antigo também sobreviveu — este teste não prova nada.');
};

document.getElementById('baixar').onclick = () => {
  const a = document.createElement('a');
  a.download = 'rasterizado.png';
  a.href = tela.toDataURL('image/png');
  a.click();
};
</script>
