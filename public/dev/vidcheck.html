<body style="background:#fff;font:16px monospace;padding:20px">
<div id="out">carregando...</div>
<canvas id="c" width="320" height="180" style="border:2px solid red"></canvas>
<script>
const v = document.createElement('video');
v.muted = true; v.playsInline = true; v.preload='auto';
const out = document.getElementById('out');
const log = [];
const report = () => out.textContent = log.join(' | ');
['loadedmetadata','loadeddata','canplay','seeked','error'].forEach(ev =>
  v.addEventListener(ev, () => { log.push(ev+':rs='+v.readyState); report(); }));
v.src = 'http://localhost:4173/dev/count_up_559872.mp4';
setTimeout(() => {
  log.push('T+2s rs='+v.readyState+' vw='+v.videoWidth+' dur='+v.duration);
  try {
    document.getElementById('c').getContext('2d').drawImage(v,0,0,320,180);
    log.push('drawImage OK');
  } catch(e) { log.push('drawImage FAIL: '+e.message); }
  report();
}, 2000);
v.currentTime = 2;
</script></body>
